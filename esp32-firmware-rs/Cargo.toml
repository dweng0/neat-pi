[package]
edition      = "2024"
name         = "esp32-firmware-rs"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32-firmware-rs"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }

critical-section = "1.2.0"

# Fixed-capacity String/Vec that live on the stack — the no_std stand-in for
# std's heap-backed String. Used by the serial line reader.
heapless = "0.8"

# The pure, hardware-free logic (serial line reader + command parser), split
# into its own crate so it builds and unit-tests on the host. Lives beside this
# crate (not inside it) so it doesn't inherit the Xtensa target from .cargo/config.
protocol = { path = "../protocol", package = "pwm-serial-protocol" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
