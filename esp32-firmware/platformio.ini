; Neato D10 brain-transplant — ESP32 real-time co-processor firmware
; Board: ESP32 WROOM-32 DevKit (ESP32-D0WD-V3), CH340C USB-serial
; Bring-up target: toolchain proof (blink + serial echo) before micro-ROS.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; CH340C on this Mac enumerates as /dev/cu.usbserial-110.
; Auto-reset via RTS works — no BOOT/EN button dance needed to flash.
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
